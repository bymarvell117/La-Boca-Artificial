<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Boca Artificial</title>
  <meta name="description" content="Simulador del aparato fonador humano: respira, vibra y habla en español.">
  <link rel="stylesheet" href="estilos.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <header class="cabecera">
    <h1>La Boca Artificial</h1>
    <p>Un aparato fonador simulado: pulmones, laringe, garganta, nariz, lengua, dientes y labios.</p>
    <button id="encender" class="primario">Encender sonido</button>
  </header>

  <main class="disposicion">
    <section class="escena" aria-label="Aparato fonador en 3D">
      <div id="escena3d" class="vista3d"></div>
      <canvas id="lienzo" hidden></canvas>
      <div class="barra-vista">
        <div class="segmentado" role="group" aria-label="Vista">
          <button data-vista="3d" aria-pressed="true">3D</button>
          <button data-vista="2d" aria-pressed="false">Corte 2D</button>
        </div>
        <div class="segmentado opciones3d" role="group" aria-label="Encuadre">
          <button data-encuadre="general">Todo</button>
          <button data-encuadre="cabeza">Cabeza</button>
          <button data-encuadre="perfil">Perfil</button>
          <button data-encuadre="frente">Frente</button>
        </div>
      </div>
      <div class="interruptores">
        <label><input type="checkbox" id="nombres" checked> Nombres</label>
        <label class="opciones3d"><input type="checkbox" id="piel" checked> Piel</label>
        <label class="opciones3d"><input type="checkbox" id="corte"> Cortar por la mitad</label>
        <span class="ayuda opciones3d">Arrastra para girar · rueda para acercar</span>
      </div>
    </section>

    <aside class="panel">
      <div class="medidores" id="medidores"></div>

      <nav class="pestanas" role="tablist">
        <button role="tab" aria-selected="true" data-pestana="hablar">Hablar</button>
        <button role="tab" aria-selected="false" data-pestana="fonemas">Fonemas</button>
        <button role="tab" aria-selected="false" data-pestana="manual">Control manual</button>
      </nav>

      <section class="pestana" id="pestana-hablar">
        <label for="texto">Escribe algo en español</label>
        <textarea id="texto" rows="3">Hola, soy la boca artificial. ¿Me oyes bien?</textarea>
        <div class="fila">
          <label>Voz
            <select id="voz">
              <option value="95">Grave</option>
              <option value="125" selected>Media</option>
              <option value="210">Aguda</option>
            </select>
          </label>
          <label>Acento
            <select id="acento">
              <option value="latam">Latinoamérica (s)</option>
              <option value="es">España (z/c = θ)</option>
            </select>
          </label>
        </div>
        <label>Velocidad <output id="velocidad-v">1.0×</output>
          <input type="range" id="velocidad" min="0.6" max="1.5" step="0.05" value="1">
        </label>
        <div class="fila">
          <button id="hablar" class="primario">Hablar</button>
          <button id="parar">Parar</button>
        </div>
        <p class="transcripcion" id="transcripcion" aria-live="polite"></p>
        <p class="nota">TTS mecánico: reglas de pronunciación del español que mueven cada órgano. No usa voces grabadas ni IA.</p>
      </section>

      <section class="pestana" id="pestana-fonemas" hidden>
        <div id="botones-fonemas"></div>
      </section>

      <section class="pestana" id="pestana-manual" hidden>
        <div id="controles"></div>
      </section>
    </aside>
  </main>

  <p class="aviso" id="aviso" hidden></p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
